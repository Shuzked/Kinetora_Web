<script>
document.addEventListener("DOMContentLoaded", () => {
  // 1. Spotlight del cursor (Ultra-óptimo con requestAnimationFrame)
  let lastX = 0, lastY = 0;
  let ticking = false;
  
  window.addEventListener("mousemove", (e) => {
    lastX = e.clientX;
    lastY = e.clientY + window.scrollY;
    
    if (!ticking) {
      window.requestAnimationFrame(() => {
        document.documentElement.style.setProperty("--mouse-x", lastX + "px");
        document.documentElement.style.setProperty("--mouse-y", lastY + "px");
        ticking = false;
      });
      ticking = true;
    }
  });

  // SVGs nativos para 0% network overhead
  const svgs = [
    '<svg class="w-full h-full text-[#B454FF]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/><path d="M2 12h20"/></svg>',
    '<svg class="w-full h-full text-[#B454FF]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>',
    '<svg class="w-full h-full text-[#B454FF]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="2" y1="7" x2="22" y2="7"/><line x1="2" y1="17" x2="22" y2="17"/></svg>',
    '<svg class="w-full h-full text-[#B454FF]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>'
  ];

  // 2. Inyección de partículas tridimensionales estática de ejecución única
  setTimeout(() => {
    // Buscar todas las secciones creadas en el DOM inicial
    const sections = Array.from(document.querySelectorAll("#root section, main > div, #root main"));
    if (sections.length === 0) return;

    sections.forEach((section, sIdx) => {
      // Excluir Footer o secciones muy pequeñas de soporte legal
      if (section.tagName === "FOOTER" || section.closest("footer") || section.offsetHeight < 200) return;

      section.style.position = "relative";
      const count = 5; // Cantidad controlada de iconos por sección para rendimiento óptimo
      
      for (let i = 0; i < count; i++) {
        const deco = document.createElement("div");
        deco.className = "kin-deco";

        // Determinar capa 3D:
        // Capa 0: Lejana (pequeña, lenta, desenfoque de 2px)
        // Capa 1: Enfoque (mediana, velocidad normal, nítida)
        // Capa 2: Cercana (grande, rápida, desenfoque de 1.5px)
        const layer = Math.floor(Math.random() * 3);
        let size, blurVal, speedClass;
        
        if (layer === 0) {
          size = Math.floor(Math.random() * 7) + 12; // 12px a 18px
          blurVal = 2; // Desenfoque óptico lejano
          speedClass = "kin-deco-slow";
        } else if (layer === 1) {
          size = Math.floor(Math.random() * 13) + 20; // 20px a 32px
          blurVal = 0; // Plano de enfoque nítido
          speedClass = "kin-deco-medium";
        } else {
          size = Math.floor(Math.random() * 23) + 42; // 42px a 64px
          blurVal = 1.5; // Desenfoque óptico en primer plano
          speedClass = "kin-deco-fast";
        }

        deco.classList.add(speedClass);

        // Posicionamiento aleatorio dentro del área física de la sección
        const x = Math.random() * 85 + 5; // 5% a 90%
        const y = Math.random() * 80 + 10; // 10% a 90%
        
        deco.style.left = x + "%";
        deco.style.top = y + "%";
        deco.style.width = size + "px";
        deco.style.height = size + "px";
        deco.style.filter = blurVal > 0 ? "blur(" + blurVal + "px)" : "none";
        
        // Rotación y opacidad estética de fondo
        const rotation = Math.floor(Math.random() * 360);
        deco.style.transform = "rotate(" + rotation + "deg)";
        deco.style.opacity = Math.random() * 0.15 + 0.05; // Opacidad sutil (5% a 20%)

        // Seleccionar icono SVG aleatorio
        deco.innerHTML = svgs[Math.floor(Math.random() * svgs.length)];

        // Añadir de forma segura a la sección
        section.appendChild(deco);
      }
    });
    console.log("[ParallaxEngine] 3D Depth of Field successfully loaded.");
  }, 1000); // 1 segundo de retraso único para permitir el montaje inicial de React
});
</script>
