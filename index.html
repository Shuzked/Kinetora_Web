      /* LCP Priority Paint: H1 must be visible immediately */
      h1 { 
        font-weight: 900; text-transform: uppercase; letter-spacing: -0.04em; line-height: 1.1; 
        margin: 0 0 1.5rem 0; opacity: 1 !important; visibility: visible !important; 
        font-size: 2.2rem;
      }
      @media (min-width: 768px) { h1 { font-size: 4.5rem; } }
