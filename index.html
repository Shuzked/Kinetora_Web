    <!-- Critical CSS for Instant First Paint -->
    <style>
      :root { --kb: #0D0D0D; --kt: #F5F5F5; --ka: #B454FF; }
      body { background: var(--kb); color: var(--kt); margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }

      #lcp-bg { position: absolute; inset: 0; z-index: 0; }
      #lcp-bg img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.45); }
      #lcp-content { position: relative; z-index: 10; max-width: 800px; padding: 0 20px; }
