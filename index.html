<!doctype html>
<html lang="es">
  <head>
    <!-- Google Tag Manager -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-MKLGBK2S');</script>
    <!-- End Google Tag Manager -->
    <meta charset="UTF-8" />
    <!-- Cookie Consent Mode v2 (Prior Consent) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      
      // Default consent status (Deny everything by default)
      gtag('consent', 'default', {
        'ad_storage': 'denied',
        'ad_user_data': 'denied',
        'ad_personalization': 'denied',
        'analytics_storage': 'denied',
        'functionality_storage': 'denied',
        'personalization_storage': 'denied',
        'security_storage': 'granted', // Always granted for security
        'wait_for_update': 500
      });

      // DataLayer stub
      window.dataLayer.push({
        'gtm.start': new Date().getTime(),
        event: 'gtm.js'
      });
    </script>
    
    <!-- No GTM/GA4 scripts here - they are loaded dynamically by useCookieConsent.ts after user choice -->

    <!-- ⚡ CRITICAL PERFORMANCE & SEO (Staff Level) -->
    <style>
      :root { --background: #0D0D0D; --foreground: #F5F5F5; --accent: #B454FF; }
      body { 
        background: #0D0D0D; color: #F5F5F5; margin: 0; font-family: 'Inter', sans-serif; 
        overflow-x: hidden; -webkit-font-smoothing: antialiased; 
      }
      #root { min-height: 100vh; display: flex; flex-direction: column; }
      .kin-container { width: 100%; max-width: 80rem; margin: 0 auto; padding: 0 1.25rem; box-sizing: border-box; }
      
      /* Layout Stability (CLS Protection) */
      nav { position: fixed; top: 0; width: 100%; z-index: 50; height: auto; }
      @media (min-width: 768px) { nav { height: auto; } }
      
      .nav-height-protection { height: auto; display: grid; grid-template-columns: 1fr 1fr; align-items: center; }
      @media (min-width: 768px) { .nav-height-protection { height: auto; grid-template-columns: 1fr auto 1fr; } }
      
      .hero-section { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; position: relative; }
      
      /* LCP Priority Paint: H1 must be visible immediately */
      h1 { 
        font-weight: 900; text-transform: uppercase; letter-spacing: -0.04em; line-height: 1.1; 
        margin: 0 0 1.5rem 0; opacity: 1 !important; visibility: visible !important; 
        font-size: 2.2rem;
      }
      @media (min-width: 768px) { h1 { font-size: 4.5rem; } }
      
      .liquid-bg-container { position: absolute; inset: 0; background: #0D0D0D; overflow: hidden; z-index: -1; }
    </style>

    <!-- Local Fonts Preload -->
    <link rel="preload" href="/assets/fonts/Inter_24pt-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" type="image/png" href="/Favicon_Kinetora.png" />
    <link rel="apple-touch-icon" href="/Favicon_Kinetora.png" />

    <script>
      // 1. Bloquear la memoria del navegador para evitar saltos automáticos
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual';
      }
    </script>
    
    <!-- JSON-LD: Dynamic injection via react-helmet-async -->
    <link rel="stylesheet" href="/src/globals.css" />

    <!-- SSR_HEAD_PLACEHOLDER -->
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MKLGBK2S"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div id="root"></div>
    <!-- Hidden SVG Noise Filter for Film Grain Texture -->
    <svg style="position: fixed; top: 0; left: 0; width: 0; height: 0; opacity: 0; pointer-events: none; overflow: hidden;" aria-hidden="true">
      <filter id="grainyNoise">
        <feTurbulence type="fractalNoise" baseFrequency="0.50" numOctaves="3" stitchTiles="stitch" />
        <feColorMatrix type="saturate" values="0" />
      </filter>
    </svg>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // 2. Forzar scroll al top después de que todo el JS y assets carguen
      window.onload = function() {
        setTimeout(function() {
          window.scrollTo({ top: 0, behavior: 'instant' });
        }, 50);
      };
    </script>
  </body>
</html>
