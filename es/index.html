<script>

  // 2. Ocultar "Backed by results..." y cursor viejo

  // 4. Parallax decorations
  setTimeout(() => {
    const candidates = Array.from(document.querySelectorAll("#root section, #root div[class*='py-20'], #root div[class*='py-24'], #root main > div > div"));
    const sections = [];
    candidates.forEach(c => {
      if (c.tagName === "FOOTER" || c.closest("footer") || c.tagName === "NAV" || c.closest("nav") || c.querySelector("h1") || c.offsetHeight < 120) return;
      const cls = c.className || "";
      if (cls.includes("grid") || cls.includes("flex-row") || cls.includes("gap-") || cls.includes("max-w-7xl")) return;
      const nested = sections.some(ex => ex.contains(c) || c.contains(ex));
      if (!nested) sections.push(c);
    });
    const heroEl = document.querySelector(".hero-section");
    if (heroEl && !sections.includes(heroEl)) sections.push(heroEl);
    if (!sections.length) return;
    const icons=["/assets/decorations/kinetora-triangle-purple.webp","/assets/decorations/kinetora-triangle-white.webp","/assets/decorations/kinetora-circle-white.webp","/assets/decorations/kinetora-circle-purple.webp","/assets/decorations/kinetora-square-white.webp","/assets/decorations/kinetora-cross-white.webp","/assets/decorations/kinetora-plus-purple.webp","/assets/decorations/kinetora-square-purple.webp","/assets/decorations/kinetora-plus-white-thin.webp","/assets/decorations/kinetora-circle-purple-shadow.webp","/assets/decorations/kinetora-triangle-purple-shadow.webp","/assets/decorations/kinetora-cross-purple-shadow.webp","/assets/decorations/kinetora-cross-purple-thin.webp","/assets/decorations/kinetora-polygon-white.webp","/assets/decorations/kinetora-zigzag-purple.webp","/assets/decorations/kinetora-chevron-white.webp"];
    function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
    const particles=[];
    sections.forEach(sec=>{sec.style.position="relative";const si=shuffle(icons);for(let i=0;i<3;i++){const d=document.createElement("div");d.className="kin-deco";const l=Math.floor(Math.random()*3);let sz,bl,sp,df;if(l===0){sz=14+Math.floor(Math.random()*6);bl=2;sp="kin-deco-slow";df=0.03;}else if(l===1){sz=20+Math.floor(Math.random()*12);bl=0;sp="kin-deco-medium";df=0.07;}else{sz=32+Math.floor(Math.random()*16);bl=1;sp="kin-deco-fast";df=0.12;}d.classList.add(sp);const x=i===0?(Math.random()*15+5):(i===1?(Math.random()*20+40):(Math.random()*15+80));d.style.left=x+"%";d.style.top=(Math.random()*60+20)+"%";d.style.width=sz+"px";d.style.height=sz+"px";d.style.filter=bl>0?"blur("+bl+"px)":"none";const rot=Math.floor(Math.random()*360);d.innerHTML='<img src="'+si[i%si.length]+'" alt="" loading="lazy" style="transform:rotate('+rot+'deg);" />';sec.appendChild(d);particles.push({element:d,x:0,y:0,tx:0,ty:0,f:df});}});
    let lmx=window.innerWidth/2,lmy=window.innerHeight/2;

    function upd(){const mx=lmx-window.innerWidth/2,my=lmy-window.innerHeight/2;particles.forEach(p=>{p.tx=mx*-p.f;p.ty=my*-p.f;p.x+=(p.tx-p.x)*0.08;p.y+=(p.ty-p.y)*0.08;p.element.style.transform="translate3d("+p.x+"px,"+p.y+"px,0)";});requestAnimationFrame(upd);}
    upd();
  }, 1200);
});
